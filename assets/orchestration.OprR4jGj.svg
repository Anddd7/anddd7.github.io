<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1280" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F6EFE4"/>
    </linearGradient>
    <linearGradient id="agent2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C36A38"/>
      <stop offset="1" stop-color="#9A4A22"/>
    </linearGradient>
    <linearGradient id="skill2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F3A54A"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="adapter2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D8A07B"/>
      <stop offset="1" stop-color="#B86A45"/>
    </linearGradient>
    <linearGradient id="api2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F7F0E6"/>
      <stop offset="1" stop-color="#EFE3D2"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#A78969" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9A4A22"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #2A2722; }
      .boxTitle { font: 700 22px Inter, Arial, sans-serif; fill: #F8FAFC; }
      .boxText { font: 500 15px Inter, Arial, sans-serif; fill: #F8EEE8; }
      .chip { font: 700 14px Inter, Arial, sans-serif; fill: #FFF7ED; }
      .apiTitle { font: 700 18px Inter, Arial, sans-serif; fill: #392F24; }
      .apiText { font: 500 14px Inter, Arial, sans-serif; fill: #746A5D; }
      .note { font: 600 15px Inter, Arial, sans-serif; fill: #9A4A22; }
      .flow { stroke: #9A4A22; stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 14 12; marker-end: url(#arrow2); }
      .pulse { fill: #C97B45; }
    </style>
  </defs>

  <rect width="1280" height="760" rx="28" fill="url(#bg2)"/>
  <text x="64" y="76" class="title">Orchestration: Supervisor Agent in the Center</text>

  <g filter="url(#shadow2)">
    <rect x="430" y="180" width="420" height="230" rx="28" fill="url(#agent2)"/>
    <text x="464" y="236" class="boxTitle">Supervisor Agent</text>
    <text x="464" y="270" class="boxText">Understands the goal, picks services,</text>
    <text x="464" y="292" class="boxText">and plans call order</text>
    <rect x="464" y="314" width="110" height="38" rx="19" fill="url(#skill2)"/>
    <text x="497" y="339" class="chip">Skill Set</text>
    <text x="590" y="339" class="boxText">Rules / use cases / errors</text>
    <rect x="464" y="362" width="150" height="38" rx="19" fill="url(#adapter2)"/>
    <text x="491" y="387" class="chip">CLI / MCP</text>
    <text x="630" y="387" class="boxText">Unified API access layer</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="76" y="260" width="210" height="96" rx="22" fill="#FFF7EF" stroke="#E7DECE"/>
    <text x="106" y="316" style="font: 700 22px Inter, Arial, sans-serif; fill: #392F24;">User Goal</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="1000" y="150" width="210" height="110" rx="22" fill="url(#api2)" stroke="#E7DECE"/>
    <text x="1030" y="194" class="apiTitle">Order API</text>
    <text x="1030" y="222" class="apiText">Pricing / checkout / discounts</text>
  </g>
  <g filter="url(#shadow2)">
    <rect x="1000" y="320" width="210" height="110" rx="22" fill="url(#api2)" stroke="#E7DECE"/>
    <text x="1030" y="364" class="apiTitle">Inventory API</text>
    <text x="1030" y="392" class="apiText">Inventory / stockouts / substitutes</text>
  </g>
  <g filter="url(#shadow2)">
    <rect x="1000" y="490" width="210" height="110" rx="22" fill="url(#api2)" stroke="#E7DECE"/>
    <text x="1030" y="534" class="apiTitle">Catalog API</text>
    <text x="1030" y="562" class="apiText">Recommendations / bundles / data</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="120" y="520" width="495" height="200" rx="24" fill="#FFF7EF" stroke="#E7DECE"/>
    <text x="154" y="570" style="font: 700 22px Inter, Arial, sans-serif; fill: #392F24;">Unified result</text>
    <text x="154" y="606" style="font: 500 15px Inter, Arial, sans-serif; fill: #5B2B16;">Combines multiple API responses into one</text>
    <text x="154" y="628" style="font: 500 15px Inter, Arial, sans-serif; fill: #5B2B16;">useful action or answer</text>
    <text x="154" y="660" class="note">Example: check stock, suggest an add-on,</text>
    <text x="154" y="682" class="note">then return one clear next step.</text>
  </g>

  <path class="flow" d="M286 308C340 308 380 290 430 290">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <circle r="6" class="pulse">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M286 308C340 308 380 290 430 290"/>
  </circle>

  <path class="flow" d="M850 290C905 290 940 205 1000 205">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.7s" repeatCount="indefinite"/>
  </path>
  <circle r="6" class="pulse">
    <animateMotion dur="1.7s" repeatCount="indefinite" path="M850 290C905 290 940 205 1000 205"/>
  </circle>

  <path class="flow" d="M850 300C920 300 930 375 1000 375">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle r="6" class="pulse">
    <animateMotion dur="2s" repeatCount="indefinite" path="M850 300C920 300 930 375 1000 375"/>
  </circle>

  <path class="flow" d="M850 310C905 310 940 545 1000 545">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="2.1s" repeatCount="indefinite"/>
  </path>
  <circle r="6" class="pulse">
    <animateMotion dur="2.1s" repeatCount="indefinite" path="M850 310C905 310 940 545 1000 545"/>
  </circle>

  <path class="flow" d="M640 400C640 455 630 490 615 520">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <circle r="6" class="pulse">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M640 400C640 455 630 490 615 520"/>
  </circle>
</svg>
